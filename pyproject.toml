[project]
name = "labes-api"
version = "0.7.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.135.3",
    "pydantic-settings>=2.5",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "plotly>=5.22",
    "pandas>=2.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
# Testes assíncronos sem precisar decorar cada um com @pytest.mark.asyncio.
asyncio_mode = "auto"
testpaths = ["tests"]
# Os render_*.py de tests/visual sobem o engine do warehouse no import — não são
# testes pytest, são scripts de inspeção manual. Ignorados na coleta.
addopts = "--ignore=tests/visual"
